name: Cloud Health & Keepalive Ping

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC) to prevent Supabase 7-day inactivity and warm Vercel
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Vercel & Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Send zero-storage keepalive ping to API
        run: |
          echo "Pinging Smart Move Traders Health API..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://smart-move-traders.vercel.app/api/health)
          echo "$RESPONSE"
